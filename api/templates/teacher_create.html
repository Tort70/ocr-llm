<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Exam Template</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    form { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 24px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="text"],
    input[type="file"] {
      display: block; width: 100%; padding: 8px;
      border: 1px solid #ccc; border-radius: 4px;
      font-size: 0.9rem; background: #fafafa;
    }
    .form-group { margin-bottom: 16px; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 4px; }

    .pilot-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 8px 10px;
      background: #f4f6f9;
      border: 1px solid #e0e4ea;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #555;
    }
    .pilot-toggle input[type="checkbox"] { margin: 0; }

    .form-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn {
      padding: 10px 20px; border-radius: 4px; font-size: 0.9rem;
      cursor: pointer; border: none;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93b4f5; cursor: not-allowed; }
    .btn-cancel { background: #fff; color: #555; border: 1px solid #ccc; }
    .btn-cancel:hover { background: #f5f5f5; }

    .msg { margin-top: 16px; padding: 12px; border-radius: 4px; font-size: 0.9rem; }
    .msg--ok  { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .msg--err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Upload Exam Template</h1>

  <form id="create-form" enctype="multipart/form-data">
    <div class="form-group">
      <label for="exam_title">Exam Title</label>
      <input type="text" id="exam_title" name="exam_title"
             placeholder="e.g. Midterm Exam — Spring 2026">
    </div>

    <div class="form-group">
      <label for="file">Exam File</label>
      <input type="file" id="file" name="file"
             accept=".pdf,.png,.jpg,.jpeg,.tiff,.webp" required>
      <p class="hint">Accepted formats: PDF, PNG, JPG, TIFF, WebP (max 10 MB)</p>
    </div>

    {% if user_role in ("instructor", "admin") %}
    <div class="pilot-toggle">
      <input type="checkbox" id="ocr_llm_pilot"
             name="ocr_llm_pilot" value="true">
      <label for="ocr_llm_pilot" style="font-weight:normal;margin:0;">
        Generate editable draft (OCR-LLM pilot)
      </label>
    </div>
    {% endif %}

    <input type="hidden" name="user_id"   value="{{ user_id }}">
    <input type="hidden" name="user_role" value="{{ user_role }}">
    {% if session_id %}
    <input type="hidden" name="session_id" value="{{ session_id }}">
    {% endif %}

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Template</button>
      <button type="button" class="btn btn-cancel"
              onclick="window.history.back()">Cancel</button>
    </div>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("create-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = this.querySelector("button[type=submit]");
      var out = document.getElementById("result");
      btn.disabled = true;
      btn.textContent = "Creating\u2026";
      out.innerHTML = "";

      fetch("/api/upload", { method: "POST", body: new FormData(this) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          var cls = res.ok ? "msg msg--ok" : "msg msg--err";
          var text = res.data.message || res.data.error || JSON.stringify(res.data);
          if (res.data.job_id) text += " (Job ID: " + res.data.job_id + ")";
          out.innerHTML = "<div class='" + cls + "'>" + text + "</div>";
        })
        .catch(function () {
          out.innerHTML = "<div class='msg msg--err'>Upload failed. Please try again.</div>";
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = "Create Template";
        });
    });
  </script>
</body>
</html>
